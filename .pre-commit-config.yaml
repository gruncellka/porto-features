# Pre-commit — fast local hygiene; CI is the authoritative validation graph.

fail_fast: true

repos:
    - repo: local
      hooks:
          - id: features
            name: features
            entry: make features
            language: system
            files: \.feature$
            pass_filenames: false
            always_run: true

          - id: fixtures
            name: fixtures
            entry: make fixtures
            language: system
            files: ^porto_features/fixtures/.*\.json$
            pass_filenames: false
            always_run: true

          - id: errors
            name: errors
            entry: make errors
            language: system
            files: \.feature$|^porto_features/errors\.json$
            pass_filenames: false
            always_run: false

          - id: lint
            name: lint
            entry: bash -c 'if [ -f venv/bin/activate ]; then . venv/bin/activate; fi && gherlint lint porto_features/features/'
            language: system
            files: \.feature$
            pass_filenames: false
            always_run: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: trailing-whitespace
            name: whitespace
          - id: end-of-file-fixer
            name: eof
          - id: check-yaml
            name: yaml
          - id: check-json
            name: json
          - id: check-added-large-files
            name: large-files
            args: ['--maxkb=300']
          - id: check-merge-conflict
            name: merge-conflict
          - id: check-case-conflict
            name: case-conflict
          - id: no-commit-to-branch
            name: branch
            args: ['--branch', 'main']
          - id: detect-private-key
            name: secrets

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.5
      hooks:
          - id: ruff-format
            name: format
            args: ['--line-length=100']
            files: ^scripts/.*\.py$

          - id: ruff
            name: lint
            args: ['--fix', '--exit-non-zero-on-fix']
            files: ^scripts/.*\.py$

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.8.0
      hooks:
          - id: mypy
            name: types
            args: ['--config-file=pyproject.toml']
            files: ^scripts/.*\.py$
            additional_dependencies:
              - types-PyYAML
