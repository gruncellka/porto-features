# Edge slice taxonomy for matrix/sdk.yaml cell_id segments.
# cell_id: {provider}.{concern}.{slice}.{porto_id}.{zone}

schema_version: 1

slices:
  happy:
    description: Catalog happy path — baseline resolve, price, or service selection
  weight_boundary:
    description: Weight tier min/max edges from porto-data weights
  service_variant:
    description: Base product plus purchasable service combinations (SDK-only)
  disambiguation:
    description: Multiple native products for one porto_id (delivery preference)
  scope:
    description: Provider catalog limits (domestic-only products, etc.)
  restriction:
    description: Sanctions, prohibited regions, policy blocks
  invalid_input:
    description: SDK validation error contracts
  wire_resolve:
    description: Resolve wire code from graph without adapter purchase
  metadata:
    description: Registry, integrations manifest, envelope catalog smoke
  prohibited:
    description: Global policy prohibition slices (provider-agnostic)
