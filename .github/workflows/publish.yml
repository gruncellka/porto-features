# Publish to npm and PyPI. Tag push v* or manual dispatch.
# Validates via reusable validation.yml; pack smoke is publish-only (Option B).

name: publish

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            publish_target:
                description: 'Publish target (tag push always runs both)'
                required: true
                default: both
                type: choice
                options:
                    - both
                    - npm
                    - pypi

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}
    cancel-in-progress: false

env:
    NODE_VERSION: '20'
    NODE_VERSION_NPM: '22'
    PYTHON_VERSION: '3.13'

jobs:
    validate:
        name: validate
        uses: ./.github/workflows/validation.yml

    pack:
        name: pack
        needs: [validate]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: setup
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: test-publish
              run: make test-publish

    npm:
        name: npm
        runs-on: ubuntu-latest
        needs: [pack]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'pypi'
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  registry-url: 'https://registry.npmjs.org/'

            - name: pack
              run: npm pack

            - name: verify
              run: |
                  tar -tzf gruncellka-porto-features-*.tgz | head -30
                  test -n "$(tar -tzf gruncellka-porto-features-*.tgz | grep 'package/porto_features/features/')"
                  test -n "$(tar -tzf gruncellka-porto-features-*.tgz | grep 'package/porto_features/fixtures/')"
                  echo "Tarball structure OK"

            - name: upload
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: gruncellka-porto-features-*.tgz

    pypi:
        name: pypi
        runs-on: ubuntu-latest
        needs: [pack]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'npm'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: setup
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"
                  pip install build

            - name: build
              run: python3 -m build

            - name: verify
              run: |
                  ls -la dist/
                  python3 -m zipfile -l dist/*.whl | head -40
                  echo "Dist structure OK"

            - name: upload
              uses: actions/upload-artifact@v4
              with:
                  name: pypi-package
                  path: dist/

    npm-publish:
        name: npm-publish
        runs-on: ubuntu-latest
        needs: [npm]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'pypi'
        permissions:
            contents: read
            id-token: write
            packages: write
        steps:
            - name: download
              uses: actions/download-artifact@v4
              with:
                  name: npm-package

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION_NPM }}

            - name: npm-cli
              run: npm install -g npm@latest

            - name: publish
              run: npm publish --access public --provenance *.tgz

    pypi-publish:
        name: pypi-publish
        runs-on: ubuntu-latest
        needs: [pypi]
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_target != 'npm'
        permissions:
            contents: read
            id-token: write
        steps:
            - name: download
              uses: actions/download-artifact@v4
              with:
                  name: pypi-package
                  path: dist

            - name: publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist

    release:
        name: release
        runs-on: ubuntu-latest
        needs: [npm-publish, pypi-publish]
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - name: release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ github.ref_name }}
                  name: Release ${{ github.ref_name }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
